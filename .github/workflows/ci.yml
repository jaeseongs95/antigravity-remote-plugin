name: CI

on:
  push:
    branches:
      - develop
      - "feature/**"
      - "fix/**"
      - "release/**"
      - main
  pull_request:
    branches:
      - develop
      - main
  workflow_dispatch:

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build and verify
        run: npm run verify
