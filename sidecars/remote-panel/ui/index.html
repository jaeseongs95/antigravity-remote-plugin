<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Remote Bridge</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="/preload.js"></script>
</head>
<body>
  <div class="app-shell">
    <header class="top-bar">
      <div class="brand-group">
        <h1 class="app-title">Remote Bridge</h1>
        <span id="connection-badge" class="status-badge" role="status" aria-live="polite">불러오는 중</span>
      </div>
      <button id="refresh-btn" type="button" class="btn btn-secondary">새로고침</button>
    </header>

    <section id="error-banner" class="error-banner" role="alert" hidden>
      <p id="error-message" class="error-text"></p>
      <button id="retry-btn" type="button" class="btn btn-primary">다시 시도</button>
    </section>

    <nav class="tab-list" role="tablist" aria-label="원격 패널 섹션">
      <button id="tab-statusbar" type="button" role="tab" class="tab-btn" aria-selected="true" aria-controls="panel-statusbar" data-tab="statusbar">상태바</button>
      <button id="tab-plugins" type="button" role="tab" class="tab-btn" aria-selected="false" aria-controls="panel-plugins" data-tab="plugins">플러그인</button>
      <button id="tab-diagnostics" type="button" role="tab" class="tab-btn" aria-selected="false" aria-controls="panel-diagnostics" data-tab="diagnostics">진단</button>
    </nav>

    <main class="main-content">
      <section id="panel-statusbar" class="tab-panel" role="tabpanel" aria-labelledby="tab-statusbar">
        <article class="card">
          <h2 class="card-title">컨텍스트 사용량</h2>
          <p id="telemetry-summary" class="metric-value">데이터를 불러오는 중...</p>
          <div class="progress-track" role="progressbar" aria-label="컨텍스트 토큰 사용률" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="usage-progressbar">
            <div id="usage-fill" class="progress-fill"></div>
          </div>
          <p id="telemetry-detail" class="helper-text"></p>
          <div class="action-row">
            <button id="compact-btn" type="button" class="btn btn-primary" disabled>컨텍스트 정리 (Compact)</button>
          </div>
          <p id="action-feedback" class="helper-text" role="status" aria-live="polite"></p>
        </article>
      </section>

      <section id="panel-plugins" class="tab-panel" role="tabpanel" aria-labelledby="tab-plugins" hidden>
        <article class="card">
          <h2 class="card-title">활성 플러그인</h2>
          <ul id="plugins-list" class="item-list"></ul>
        </article>
        <article class="card">
          <h2 class="card-title">실행 중인 사이드카</h2>
          <ul id="sidecars-list" class="item-list"></ul>
        </article>
      </section>

      <section id="panel-diagnostics" class="tab-panel" role="tabpanel" aria-labelledby="tab-diagnostics" hidden>
        <article class="card">
          <h2 class="card-title">보안·원격 경계 상태</h2>
          <dl id="diagnostics-list" class="kv-list"></dl>
        </article>
        <article class="card">
          <h2 class="card-title">모바일 브라우저 안내</h2>
          <p class="helper-text">
            상태바 텔레메트리·컨텍스트 정리·플러그인/MCP 진단은 모바일과 데스크톱 모두에서 공식 Sidecar 게이트웨이로 동작합니다.
            호스트 메인 채팅창 DOM 직접 번역은 브라우저 보안 경계(SOP)상 데스크톱 오버레이 브리지에서만 지원됩니다.
          </p>
        </article>
      </section>
    </main>
  </div>
  <script type="module" src="/app.js"></script>
</body>
</html>
